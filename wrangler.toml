name = "yeeps-api"
main = "src/index.js"
compatibility_date = "2025-01-01"

# Serve the API from its own hostname (Cloudflare creates the DNS record on deploy).
routes = [{ pattern = "api.bloomnetworks.net", custom_domain = true }]

[vars]
# Pages allowed to call the API (comma separated, no trailing slash).
ALLOWED_ORIGINS = "https://yeeps.bloomnetworks.net,https://api.bloomnetworks.net"

# Unreleased site work, served at /preview for signed-in admins only.
# run_worker_first keeps the files from being served before the sign-in check.
[assets]
directory = "./preview"
binding = "ASSETS"
run_worker_first = true
# Serve files exactly as named; the default would redirect /index.html to /.
html_handling = "none"

# Create with:  npx wrangler kv namespace create CONTENT
[[kv_namespaces]]
binding = "CONTENT"
id = "7eb121b9aa8540daa6b6c0277be398dc"

# Secrets (never committed):
#   ADMIN_PASSWORD_HASH  output of scripts/hash-password.mjs
#   SESSION_SECRET       any long random string, e.g. `openssl rand -hex 32`
